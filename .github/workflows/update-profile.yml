name: Update Profile

on:
  push:
    branches:
      - main
  schedule:
    # Every 6 hours. Picks up repos that were deleted, renamed, or got a new
    # live link without waiting for a push to this profile repo.
    # Note: GitHub can delay scheduled runs by ~15-30 min; that is normal.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate stats SVGs
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_stats.py

      - name: Update project cards
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_projects.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/ README.md
          if git diff --staged --quiet; then
            echo "No changes - nothing to commit or push"
          else
            git commit -m "chore: update profile stats [skip ci]"
            git push
          fi
